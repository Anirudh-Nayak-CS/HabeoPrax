<!DOCTYPE html>
<html>
<head>
  <title>HabeoPrax</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    #motivation { font-style: italic; margin-bottom: 10px; }
    .reward-emoji {
      font-size: 1.2em;
      margin-left: 10px;
      animation: pop 0.7s ease forwards;
      display: inline-block;
      opacity: 0;
    }
    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      50% { transform: scale(1.5); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }
    #offlineBanner {
      background: #f44336;
      color: white;
      text-align: center;
      padding: 5px;
      display: none;
    }
  </style>
</head>
<body>
  <h1 id="heading">HabeoPrax</h1>
  
  <div id="offlineBanner">You are offline. Changes will sync when online.</div>
  
  <div id="login-section">
    <h2>Login</h2>
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button id="loginBtn">Login</button>
    <p id="loginMessage"></p>
  </div>

  <div id="habit-section" style="display: none;">
    <div id="motivation"></div>
    <h2>Your Habits</h2>
    <ul id="habitList"></ul>

    <button id="toggleAddFormBtn">+ Add New Habit</button>
    <form id="addHabitForm" style="display: none;">
      <input type="text" id="title" placeholder="Title" required />
      <input type="text" id="icon" placeholder="Icon (e.g. 💪)" required />
      <input type="text" id="duration" placeholder="Duration (e.g. 30 days)" required />
      <input type="time" id="time" required />
      <input type="text" id="day" placeholder="Days (comma-separated)" required />
      <label>
        <input type="checkbox" id="setReminder" /> Set Reminder
      </label>
      <button type="submit">Add Habit</button>
    </form>
  </div>

  <script src="popup.js"></script>
</body>
</html>
